{% extends "base.html" %}

{% block title %}Login | SmartMeasure AI{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back 👋</h1>

        <p>Login to continue using SmartMeasure AI</p>

    <form

     action="/dashboard" method="GET">

     <input
        type="email"
        placeholder="Email Address"
        required
     >

     <input
        type="password"
        placeholder="Password"
        required
     >

     <button type="submit">
        Login
     </button>

    </form>

        <div class="bottom-text">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

</div>

{% endblock %}
